name: Sync team statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: team-statistics-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Check active official schedules
        run: npm run stats:sync:york-central
        env:
          STATS_SYNC_SCOPE: current
      - name: Publish changed official data
        shell: bash
        run: |
          if git diff --quiet -- src/stats/yorkCentralSnapshot.json; then
            echo "No official statistics changes detected." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "goonsquad-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/stats/yorkCentralSnapshot.json
          git commit -m "chore(stats): refresh official results"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published updated official statistics to the live app." | tee -a "$GITHUB_STEP_SUMMARY"
