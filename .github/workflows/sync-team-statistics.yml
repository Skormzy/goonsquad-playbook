name: Sync team statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: team-statistics-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Check active official schedules
        run: npm run stats:sync:york-central
        env:
          STATS_SYNC_SCOPE: current
      - name: Publish new results and social activity to Squad Live
        run: npm run feed:sync:activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TEAM_FEED_INGEST_TOKEN: ${{ secrets.TEAM_FEED_INGEST_TOKEN }}
          TEAM_FEED_BACKFILL_SINCE: '2026-01-01T00:00:00.000Z'
          TEAM_YOUTUBE_CHANNEL_ID: UCtNyBYGsEMv_puzlZn_yntg
          TEAM_YOUTUBE_CHANNEL_HANDLE: GoonsquadBHC
          TEAM_YOUTUBE_RECENT_LIMIT: '12'
          TEAM_YOUTUBE_PLAYLIST_ID: ${{ secrets.TEAM_YOUTUBE_PLAYLIST_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TEAM_INSTAGRAM_USER_ID: ${{ secrets.TEAM_INSTAGRAM_USER_ID }}
          TEAM_INSTAGRAM_LABEL: '@goonsquad_bhc'
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TEAM_TIKTOK_LABEL: '@goonsquad.bhc'
          TEAM_TIKTOK_PROFILE_URL: 'https://www.tiktok.com/@goonsquad.bhc'
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      - name: Publish changed official data
        shell: bash
        run: |
          if git diff --quiet -- src/stats/yorkCentralSnapshot.json src/feed/officialYoutubeActivity.json; then
            echo "No official team data changes detected." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "goonsquad-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/stats/yorkCentralSnapshot.json src/feed/officialYoutubeActivity.json
          git commit -m "chore(data): refresh official team activity"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published updated official team data to the live app." | tee -a "$GITHUB_STEP_SUMMARY"
